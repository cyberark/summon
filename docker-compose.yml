services:
  conjur:
    image: ${REGISTRY_URL:-docker.io}/cyberark/conjur:edge
    command: server -a cucumber
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres/postgres
      CONJUR_DATA_KEY: ${CONJUR_DATA_KEY}
    depends_on:
      - postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    cap_drop:
      - ALL
    cap_add: # kics-scan ignore-line
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: summon-tester
    entrypoint: /bin/bash
    command: './bin/test-entrypoint.sh'
    cap_drop:
      - ALL
    cap_add: # kics-scan ignore-line # kics-scan ignore-block
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "echo", "healthy"]
      interval: 5s
      timeout: 5s
      retries: 1
    volumes:
      - ./output/integration:/summon/output/integration
    environment:
      CONJUR_IGNORE_UNTRUSTED_SSL: "true"
      CONJUR_ACCOUNT:
      CONJUR_APPLIANCE_URL:
      CONJUR_AUTHN_LOGIN:
      CONJUR_AUTHN_API_KEY:
      CONJUR_ADMIN_LOGIN:
      CONJUR_ADMIN_API_KEY:
      TEST_AWS:
      CONJUR_AWS_ACCOUNT_ID:
      CONJUR_AWS_ROLE_NAME:
      TEST_AZURE:
      AZURE_SUBSCRIPTION_ID:
      AZURE_RESOURCE_GROUP:
      AZURE_TENANT_ID:
      TEST_GCP:
      GCP_PROJECT_ID:
      GCP_ID_TOKEN:
      TEST_CERT:
      CONJUR_CERT_APPLIANCE_URL:
      CONJUR_CERT_AUTHN_LOGIN:
      CONJUR_CERT_AUTHN_API_KEY:
      CONJUR_CERT_SSL_CERTIFICATE:
      CONJUR_AUTHN_CERT_FILE:
      CONJUR_AUTHN_CERT_KEY_FILE:
      TEST_CERT_CA_CERT:
    networks:
      - default
      - conjur

  # Enterprise appliance for authn-cert integration tests (TEST_CERT=true).
  # registry.tld is the standard CyberArk private registry hostname.
  conjur-leader:
    image: ${REGISTRY_URL:-registry.tld}/conjur-appliance:${APPLIANCE_TAG:-5.0-stable}
    hostname: conjur-leader-1.mycompany.local
    restart: unless-stopped
    security_opt:
      # Enterprise appliance needs keyctl for its session keyring; Docker's default seccomp blocks it.
      # kics-scan ignore-line
      - seccomp:unconfined
      - no-new-privileges:true
    environment:
      CONJUR_LOG_LEVEL: debug
      CONJUR_HOSTNAME: conjur-leader-1.mycompany.local
      CONJUR_ACCOUNT: conjur
      # Test-only default for local/CI appliance bootstrap; override via CONJUR_ADMIN_PASSWORD.
      # kics-scan ignore-line
      CONJUR_ADMIN_PASSWORD: ${CONJUR_ADMIN_PASSWORD:-MySecretP@ss1}
    networks:
      conjur:
        aliases:
          - conjur-leader-1.mycompany.local
    profiles:
      - cert

networks:
  conjur:
    driver: bridge
