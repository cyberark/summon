# REGISTRY_URL is for Conjur images only (defaults to the CyberArk private
# registry). Public images (postgres, mock-jwt-server) stay on Docker Hub.
services:
  conjur:
    image: ${REGISTRY_URL:-registry.tld}/cyberark/conjur:edge
    command: server -a cucumber
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres/postgres
      CONJUR_DATA_KEY: ${CONJUR_DATA_KEY}
    depends_on:
      - postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - conjur
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Public image — do not prefix with REGISTRY_URL (not mirrored to registry.tld).
  mock-jwt-server:
    image: docker.io/cyberark/mock-jwt-server:latest
    environment:
      ISSUER: "jwt-server"
      AUDIENCE: "conjur"
      SUBJECT: "test-workload"
      EMAIL: "workload@example.com"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    cap_drop:
      - ALL
    cap_add: # kics-scan ignore-line
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: summon-tester
    entrypoint: /bin/bash
    command: './bin/test-entrypoint.sh'
    cap_drop:
      - ALL
    cap_add: # kics-scan ignore-line # kics-scan ignore-block
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "echo", "healthy"]
      interval: 5s
      timeout: 5s
      retries: 1
    volumes:
      - ./output/integration:/summon/output/integration
      # spiffe-sockets is populated only when the spiffe profile is active.
      # The directory is always present but the socket is absent when SPIFFE is not running.
      - spiffe-sockets:/run/spire-agent # kics-scan ignore-line
    environment:
      CONJUR_IGNORE_UNTRUSTED_SSL: "true"
      CONJUR_ACCOUNT:
      CONJUR_APPLIANCE_URL:
      CONJUR_AUTHN_LOGIN:
      CONJUR_AUTHN_API_KEY:
      CONJUR_ADMIN_LOGIN:
      CONJUR_ADMIN_API_KEY:
      TEST_AWS:
      CONJUR_AWS_ACCOUNT_ID:
      CONJUR_AWS_ROLE_NAME:
      TEST_AZURE:
      AZURE_SUBSCRIPTION_ID:
      AZURE_RESOURCE_GROUP:
      AZURE_TENANT_ID:
      TEST_GCP:
      GCP_PROJECT_ID:
      GCP_ID_TOKEN:
      TEST_CERT:
      CONJUR_CERT_APPLIANCE_URL:
      CONJUR_CERT_AUTHN_LOGIN:
      CONJUR_CERT_AUTHN_API_KEY:
      CONJUR_CERT_SSL_CERTIFICATE:
      CONJUR_AUTHN_CERT_FILE:
      CONJUR_AUTHN_CERT_KEY_FILE:
      TEST_CERT_CA_CERT:
      TEST_SAAS:
      JWT:
      PUBLIC_KEYS:
      TEST_SPIFFE:
      SPIFFE_ENDPOINT_SOCKET:
      CONJUR_AUTHN_CERT_SERVICE_ID:
      CONJUR_AUTHN_CERT_HOST_ID:
      CONJUR_AUTHN_JWT_SPIFFE_SERVICE_ID:
      CONJUR_AUTHN_JWT_SPIFFE_OIDC_SERVICE_ID:
      CONJUR_AUTHN_JWT_HOST_ID:
      CONJUR_SPIFFE_ID:
    networks:
      - default
      - conjur

  # SPIRE server for SPIFFE Workload API integration tests (TEST_SPIFFE=true).
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.9.6
    command: ["-config", "/etc/spire/server.conf"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./ci/spiffe/server.conf:/etc/spire/server.conf:ro
      - spire-data:/data/spire # kics-scan ignore-line
      - spire-server-socket:/run/spire-server/private # kics-scan ignore-line
    networks:
      - conjur
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/run/spire-server/private/api.sock"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles:
      - spiffe

  # SPIRE agent for SPIFFE Workload API integration tests (TEST_SPIFFE=true).
  # SPIRE_JOIN_TOKEN is generated by bin/setup-spiffe.sh at runtime.
  #
  # pid: host is required for the unix WorkloadAttestor. The agent identifies
  # workloads by reading /proc/<pid> via the PID returned by SO_PEERCRED.
  # Without host PID namespace access the agent's /proc does not include the
  # test container's processes, and workload attestation fails with Unavailable.
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.9.6
    command: ["-config", "/etc/spire/agent.conf", "-joinToken", "${SPIRE_JOIN_TOKEN}"]
    environment:
      SPIRE_JOIN_TOKEN:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pid: "host" # kics-scan ignore-line
    volumes:
      - ./ci/spiffe/agent.conf:/etc/spire/agent.conf:ro
      - spire-data:/data/spire # kics-scan ignore-line
      - spiffe-sockets:/run/spire-agent # kics-scan ignore-line
    depends_on:
      spire-server:
        condition: service_healthy
    networks:
      - conjur
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire-agent/api.sock"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles:
      - spiffe

  # SPIRE OIDC Discovery Provider — serves the JWKS endpoint over plain HTTP at
  # http://spire-oidc:8085/keys. Conjur uses this URL for the authn-jwt jwks-uri
  # variable, enabling dynamic key rotation without re-running setup.
  # The provider connects to the SPIRE server admin socket via the shared
  # spire-server-socket volume.
  spire-oidc:
    image: ghcr.io/spiffe/oidc-discovery-provider:1.9.6
    hostname: spire-oidc
    entrypoint: ["/opt/spire/bin/oidc-discovery-provider", "-config", "/etc/spire/oidc/oidc-discovery-provider.conf"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./ci/spiffe/oidc-discovery-provider.conf:/etc/spire/oidc/oidc-discovery-provider.conf:ro
      - spire-server-socket:/run/spire-server/private:ro # kics-scan ignore-line
    depends_on:
      spire-server:
        condition: service_healthy
    networks:
      - conjur
    profiles:
      - spiffe

  # Enterprise appliance for authn-cert and SWA self-hosted integration tests.
  conjur-leader:
    image: ${REGISTRY_URL:-registry.tld}/conjur-appliance:${APPLIANCE_TAG:-5.0-stable}
    hostname: conjur-leader-1.mycompany.local
    restart: unless-stopped
    ports:
      # kics-scan ignore-line
      - "127.0.0.1:${ENTERPRISE_APPLIANCE_PORT:-8443}:443"
    cap_drop:
      - ALL
    cap_add: # kics-scan ignore-line
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - AUDIT_WRITE
    security_opt:
      # Enterprise appliance needs keyctl for its session keyring; Docker's default seccomp blocks it.
      # kics-scan ignore-line
      - seccomp:unconfined
      - no-new-privileges:true
    environment:
      CONJUR_LOG_LEVEL: debug
      CONJUR_HOSTNAME: conjur-leader-1.mycompany.local
      CONJUR_ACCOUNT: conjur
      # Test-only default for local/CI appliance bootstrap; override via CONJUR_ADMIN_PASSWORD.
      # kics-scan ignore-line
      CONJUR_ADMIN_PASSWORD: ${CONJUR_ADMIN_PASSWORD:-MySecretP@ss1}
    networks:
      conjur:
        aliases:
          - conjur-leader-1.mycompany.local
    profiles:
      - cert
      - spiffe
      - swa-enterprise

networks:
  conjur:
    driver: bridge

volumes:
  spire-data:
  spire-server-socket:
  spiffe-sockets:
