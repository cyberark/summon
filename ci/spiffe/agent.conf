agent {
  data_dir          = "/data/spire/agent"
  log_level         = "INFO"
  server_address    = "spire-server"
  server_port       = "8081"
  socket_path       = "/run/spire-agent/api.sock"
  trust_domain      = "example.org"
  insecure_bootstrap = true
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "disk" {
    plugin_data {
      directory = "/data/spire/agent"
    }
  }

  WorkloadAttestor "unix" {
    plugin_data {}
  }
}

health_checks {
  listener_enabled = true
  bind_address     = "0.0.0.0"
  bind_port        = "9980"
  live_path        = "/live"
  ready_path       = "/ready"
}
