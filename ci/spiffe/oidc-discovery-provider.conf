# SPIRE OIDC Discovery Provider configuration for integration testing.
#
# Connects to the SPIRE server admin socket (shared via the spire-server-socket
# named volume) and serves the JWKS endpoint over plain HTTP on port 8085.
# Conjur's authn-jwt jwks-uri variable is set to http://spire-oidc:8085/keys.
#
# insecure_addr disables TLS so no certificate management is required in the
# integration test environment.

server_api {
  address = "unix:///run/spire-server/private/api.sock"
}

domains = ["spire-oidc"]

insecure_addr = ":8085"
