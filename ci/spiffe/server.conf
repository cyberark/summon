server {
  bind_address = "0.0.0.0"
  bind_port    = "8081"
  trust_domain = "example.org"
  data_dir     = "/data/spire/server"
  log_level    = "INFO"

  ca_ttl               = "168h"
  default_x509_svid_ttl = "1h"
  default_jwt_svid_ttl  = "5m"

  # Use RSA-2048 for JWT-SVID signing so the key type (RSA) is unambiguous to
  # Conjur's authn-jwt. SPIRE's OIDC Discovery Provider (go-jose) omits the
  # "alg" field in JWKS; Conjur defaults to RS256 for RSA keys. EC keys without
  # "alg" would cause Conjur to mismatch (ES256 vs RS256 default) → 401.
  jwt_key_type = "rsa-2048"

  # Set jwt_issuer to the OIDC Discovery Provider URL. Without this, SPIRE
  # defaults to the bare trust domain name ("example.org"), which matches
  # neither "spiffe://example.org" nor "http://spire-oidc:8085" as configured
  # in the Conjur authn-jwt authenticators → CONJ00091E "iss missing".
  # Both authenticators (spiffe-jwt and spiffe-jwt-oidc) compare the JWT "iss"
  # against their configured issuer; both must match this value.
  jwt_issuer = "http://spire-oidc:8085"

  # Admin socket path shared with the SPIRE OIDC Discovery Provider via the
  # spire-server-socket named volume. Pass -socketPath to all spire-server CLI
  # commands when the default path (/tmp/spire-server/private/api.sock) is not used.
  socket_path = "/run/spire-server/private/api.sock"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type     = "sqlite3"
      connection_string = "/data/spire/server/datastore.sqlite3"
    }
  }

  KeyManager "disk" {
    plugin_data {
      keys_path = "/data/spire/server/keys.json"
    }
  }

  NodeAttestor "join_token" {
    plugin_data {}
  }
}

health_checks {
  listener_enabled = true
  bind_address     = "0.0.0.0"
  bind_port        = "8080"
  live_path        = "/live"
  ready_path       = "/ready"
}
